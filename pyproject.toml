[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "partyplanner64"
version = "0.9.0"
description = "Mario Party N64 board editor"
readme = "README.md"
license = { text = "Public Domain" }
requires-python = ">=3.10"
dependencies = [
    "Pillow>=9",
]

[project.optional-dependencies]
# Compiling custom events written in C (runs the SmallerC compiler's WebAssembly build).
c = ["wasmtime>=20"]
dev = ["pytest>=7", "wasmtime>=20"]

[project.scripts]
partyplanner64 = "partyplanner64.cli:main"

[tool.setuptools.packages.find]
include = ["partyplanner64*"]

[tool.setuptools.package-data]
partyplanner64 = ["static/**/*", "lib/img/**/*", "lib/vendor/*", "lib/symbols/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
