<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PartyPlanner64</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon/favicon-32x32.png">
  <link rel="stylesheet" href="/static/css/app.css">
  <script type="importmap">{ "imports": { "three": "/static/vendor/three/three.module.min.js" } }</script>
  <script type="module" src="/static/js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/static/img/header/logo.png" alt="PartyPlanner64" class="brand-logo">
      <p id="hostLine">Connecting…</p>
    </div>
    <!-- Page tabs. data-needs: "rom" (a ROM is open), "advanced" or "debug" (settings). -->
    <nav class="page-tabs" aria-label="Pages">
      <button type="button" class="head-btn active" data-page="editor" title="Lay out a board's spaces and paths"><img src="/static/img/header/board.png" alt=""><span>Editor</span></button>
      <button type="button" class="head-btn" data-page="details" title="Name, backgrounds, music"><img src="/static/img/header/editdetails.png" alt=""><span>Details</span></button>
      <button type="button" class="head-btn" data-page="events" title="Event library and custom events"><img src="/static/img/header/events.png" alt=""><span>Events</span></button>
      <button type="button" class="head-btn" data-page="reference" title="MIPS, C and game functions explained"><img src="/static/img/header/reference.svg" alt=""><span>Reference</span></button>
      <button type="button" class="head-btn" data-page="audio" data-needs="rom" title="The ROM's songs and sounds"><img src="/static/img/header/audio.png" alt=""><span>Audio</span></button>
      <button type="button" class="head-btn" data-page="models" data-needs="rom" title="The ROM's 3D models"><img src="/static/img/header/modelviewer.png" alt=""><span>Models</span></button>
      <button type="button" class="head-btn" data-page="sprites" data-needs="rom" title="The ROM's sprites and images"><img src="/static/img/header/sprites.png" alt=""><span>Sprites</span></button>
      <button type="button" class="head-btn" data-page="strings" data-needs="rom advanced" title="The ROM's text"><img src="/static/img/header/stringseditor.png" alt=""><span>Strings</span></button>
      <button type="button" class="head-btn" data-page="patches" data-needs="rom" title="GameShark codes and patches"><img src="/static/img/header/rompatch.png" alt=""><span>Patches</span></button>
      <button type="button" class="head-btn" data-page="debug" data-needs="debug" title="Look inside the ROM"><img src="/static/img/header/debug.png" alt=""><span>Debug</span></button>
      <button type="button" class="head-btn" data-page="settings" title="Editor settings"><img src="/static/img/header/settings.png" alt=""><span>Settings</span></button>
      <button type="button" class="head-btn" data-page="about" title="About PartyPlanner64"><img src="/static/img/header/about.png" alt=""><span>About</span></button>
    </nav>
    <div class="topstats">
      <button type="button" id="romLoadBtn" class="head-btn" title="Open a Mario Party (U) ROM: .z64, .n64 or .v64"><img src="/static/img/header/romcart.png" alt=""><span>Load ROM</span></button>
      <button type="button" id="romSaveBtn" class="head-btn" hidden title="Download the ROM with the boards written to it"><img src="/static/img/header/romsave.png" alt=""><span>Save ROM</span></button>
      <button type="button" id="romCloseBtn" class="head-btn" hidden title="Close the ROM (unsaved changes to it are lost)"><img src="/static/img/header/romclose.png" alt=""><span>Close ROM</span></button>
      <span id="romBadge" class="badge badge-idle"><span class="dot"></span><span>No ROM</span></span>
    </div>
  </header>

  <!-- Each page module (js/pages/<page>.js) fills its container the first time it is shown. -->
  <div id="page-editor" class="page" hidden></div>
  <div id="page-details" class="page" hidden></div>
  <div id="page-events" class="page" hidden></div>
  <div id="page-reference" class="page" hidden></div>
  <div id="page-audio" class="page" hidden></div>
  <div id="page-models" class="page" hidden></div>
  <div id="page-sprites" class="page" hidden></div>
  <div id="page-strings" class="page" hidden></div>
  <div id="page-patches" class="page" hidden></div>
  <div id="page-debug" class="page" hidden></div>
  <div id="page-settings" class="page" hidden></div>
  <div id="page-about" class="page" hidden></div>

  <dialog id="appDialog" class="dialog"></dialog>
  <div id="busy" class="busy" hidden><div class="busy-card"><span class="spinner"></span><span id="busyText">Working…</span></div></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <input type="file" id="filePicker" hidden>
</body>
</html>
